[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"
[project]
name = "international-tax-network-lab"
version = "0.1.0"
description = "Local-first academic workbench for international taxation network research"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["pandas>=2.0", "networkx>=3.1", "plotly>=5.18"]
[project.optional-dependencies]
app = ["streamlit>=1.32"]
notebook = ["jupyterlab>=4.0", "ipykernel>=6.0"]
test = ["pytest>=8.0"]
[tool.setuptools.packages.find]
where = ["src"]
[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
