[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "international-tax-network-lab"
version = "0.4.0"
description = "Local-first academic workbench for international taxation network research"
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Leong Wen Yi" }]
license = { text = "All rights reserved (licence to be decided; see docs/PROJECT_PLAN_v2_3.md s 4.6)" }
# The core deliberately avoids numerical and dataframe libraries so that the Windows executable
# stays small and its behaviour is easy to audit. Notebook helpers are optional.
dependencies = ["networkx>=3.2"]

[project.optional-dependencies]
notebook = ["jupyterlab>=4.0", "ipykernel>=6.0", "pandas>=2.0"]
test = ["pytest>=8.0", "hypothesis>=6.100"]
build = ["pyinstaller>=6.10"]

[project.scripts]
taxnetlab = "taxnetlab.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
taxnetlab = ["web/*.html", "web/*.css", "web/*.js", "web/locales/*.json", "web/vendor/*.js", "_build_manifest.json"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-ra"
