name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Tests (${{ matrix.os }}, Python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[test]"
      - name: Test suite
        run: python -m pytest -q
      - name: End-to-end self-test (from source)
        run: python -m taxnetlab selftest

  windows-exe:
    name: Windows executable
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install locked build environment (hash-checked)
        run: |
          python -m pip install --upgrade pip
          python -m pip install --require-hashes -r requirements/windows-build.lock
          python -m pip install --no-deps -e .
      - name: Write build manifest
        run: python scripts/write_build_manifest.py requirements/windows-build.lock
      - name: Build taxnetlab.exe
        run: pyinstaller --noconfirm --clean packaging/taxnetlab.spec
      - name: Self-test the built executable
        run: |
          dist\taxnetlab.exe selftest
          dist\taxnetlab.exe version
        shell: cmd
      - name: Checksums
        shell: pwsh
        run: |
          $h = (Get-FileHash dist\taxnetlab.exe -Algorithm SHA256).Hash.ToLower()
          "$h  taxnetlab.exe" | Out-File -Encoding ascii dist\SHA256SUMS.txt
          Get-Content dist\SHA256SUMS.txt
          (Get-Item dist\taxnetlab.exe).Length / 1MB
      - uses: actions/upload-artifact@v4
        with:
          name: taxnetlab-windows-x64
          path: |
            dist/taxnetlab.exe
            dist/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 30

  release:
    name: Publish release (tags only)
    if: startsWith(github.ref, 'refs/tags/v')
    needs: windows-exe
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: taxnetlab-windows-x64
          path: dist
      - name: Create GitHub release with the executable
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" dist/taxnetlab.exe dist/SHA256SUMS.txt \
            --repo "${GITHUB_REPOSITORY}" --title "International Tax Network Lab ${GITHUB_REF_NAME}" \
            --notes "Windows executable built and self-tested by CI. Verify with SHA256SUMS.txt. Synthetic data only; the three published-method engines are at interface status." \
            --prerelease
