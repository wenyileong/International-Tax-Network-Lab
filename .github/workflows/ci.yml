name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Tests (${{ matrix.os }}, Python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[test]"
      - name: Test suite (with coverage)
        run: python -m pytest -q --cov=taxnetlab --cov-report=term-missing:skip-covered
      - name: End-to-end self-test (from source)
        run: python -m taxnetlab selftest

  windows-exe:
    name: Windows executable
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install locked build environment (hash-checked)
        run: |
          python -m pip install --upgrade pip
          python -m pip install --require-hashes -r requirements/windows-build.lock
          python -m pip install --no-deps -e .
      - name: Write build manifest
        run: python scripts/write_build_manifest.py requirements/windows-build.lock
      - name: Build taxnetlab.exe
        run: pyinstaller --noconfirm --clean packaging/taxnetlab.spec
      - name: Self-test the built executable
        run: |
          dist\taxnetlab.exe selftest
          dist\taxnetlab.exe version
        shell: cmd
      - name: Build the per-user installer (Inno Setup)
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress | Out-Null }
          if (-not (Test-Path $iscc)) { $iscc = (Get-Command iscc).Source }
          $ver = python -c "import taxnetlab; print(taxnetlab.__version__)"
          & $iscc "/DAppVersion=$ver" packaging\installer.iss
          if ($LASTEXITCODE -ne 0) { exit 1 }
      - name: Install silently (no administrator rights), self-test, uninstall
        shell: pwsh
        run: |
          $setup = (Get-ChildItem dist\taxnetlab-setup-*.exe | Select-Object -First 1).FullName
          $dir = Join-Path $env:RUNNER_TEMP "ITNL install test"
          $p = Start-Process $setup -ArgumentList "/VERYSILENT","/SUPPRESSMSGBOXES","/NORESTART","/CURRENTUSER","/DIR=`"$dir`"" -Wait -PassThru
          if ($p.ExitCode -ne 0) { Write-Error "installer exit code $($p.ExitCode)"; exit 1 }
          $before = (Get-ChildItem $dir -Recurse | Measure-Object).Count
          & "$dir\taxnetlab.exe" selftest
          if ($LASTEXITCODE -ne 0) { exit 1 }
          $after = (Get-ChildItem $dir -Recurse | Measure-Object).Count
          if ($after -ne $before) { Write-Error "the program wrote inside its installation folder"; exit 1 }
          $u = Start-Process (Join-Path $dir "unins000.exe") -ArgumentList "/VERYSILENT","/SUPPRESSMSGBOXES","/NORESTART" -Wait -PassThru
          Start-Sleep -Seconds 5
          if (Test-Path (Join-Path $dir "taxnetlab.exe")) { Write-Error "uninstall left the executable"; exit 1 }
      - name: Checksums
        shell: pwsh
        run: |
          Push-Location dist
          Get-ChildItem taxnetlab.exe, taxnetlab-setup-*.exe | ForEach-Object {
            "$((Get-FileHash $_.Name -Algorithm SHA256).Hash.ToLower())  $($_.Name)" } | Out-File -Encoding ascii SHA256SUMS.txt
          Get-Content SHA256SUMS.txt
          Pop-Location
      - uses: actions/upload-artifact@v4
        with:
          name: taxnetlab-windows-x64
          path: |
            dist/taxnetlab.exe
            dist/taxnetlab-setup-*.exe
            dist/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 30

  release:
    name: Publish release (tags only)
    if: startsWith(github.ref, 'refs/tags/v')
    needs: windows-exe
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: taxnetlab-windows-x64
          path: dist
      - name: Create GitHub release with the executable
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" dist/taxnetlab.exe dist/taxnetlab-setup-*.exe dist/SHA256SUMS.txt \
            --repo "${GITHUB_REPOSITORY}" --title "International Tax Network Lab ${GITHUB_REF_NAME}" \
            --notes "Windows executable and per-user installer, built and self-tested by CI. Verify with SHA256SUMS.txt. Unsigned. See CHANGELOG.md and the build status report for engine statuses; results from engines below 'verified' are marked unverified." \
            --prerelease
